# User Management Service Deployment for Agba Voice AI Platform
# Comprehensive user authentication, authorization, and organization management

apiVersion: v1
kind: ConfigMap
metadata:
  name: user-management-service-config
  namespace: agba-system
data:
  config.yaml: |
    environment: production
    version: "1.0.0"
    
    server:
      port: 8080
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 120s
    
    database:
      driver: postgres
      dsn: "postgresql://agba_user:${POSTGRES_PASSWORD}@pgbouncer:5432/agba_core?sslmode=require"
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: 300s
    
    redis:
      address: "redis-master:6379"
      password: "${REDIS_PASSWORD}"
      db: 3
      pool_size: 10
    
    nats:
      url: "nats://nats-client:4222"
      username: "agba_user"
      password: "${NATS_PASSWORD}"
    
    auth:
      jwt_secret: "${JWT_SECRET}"
      jwt_issuer: "agba.ai"
      jwt_audience: "agba.ai"
      access_token_ttl: 15m
      refresh_token_ttl: 168h
      session_ttl: 24h
      max_sessions: 5
      password_min_length: 8
      password_max_length: 128
      password_require_upper: true
      password_require_lower: true
      password_require_digit: true
      password_require_special: true
      max_login_attempts: 5
      lockout_duration: 30m
      two_factor_enabled: false
      two_factor_issuer: "Agba.ai"
      oauth2_enabled: true
      email_verification_required: true
      email_verification_ttl: 24h
      password_reset_ttl: 1h
      rate_limit_enabled: true
      login_rate_limit: 10
      registration_rate_limit: 5
    
    user_management:
      default_role: "user"
      allow_self_registration: true
      require_email_verification: true
      allow_username_login: true
      allow_email_login: true
      username_min_length: 3
      username_max_length: 50
      profile_picture_max_size: 5242880
      invitation_ttl: 168h
      user_data_retention: 2160h
      audit_log_retention: 2160h
    
    email:
      enabled: true
      provider: "smtp"
      smtp_host: "${SMTP_HOST}"
      smtp_port: 587
      smtp_user: "${SMTP_USER}"
      smtp_pass: "${SMTP_PASS}"
      from_email: "noreply@agba.ai"
      from_name: "Agba.ai"
      templates:
        welcome_template: "welcome"
        verification_template: "verification"
        password_reset_template: "password_reset"
        invitation_template: "invitation"
        password_changed_template: "password_changed"
    
    storage:
      provider: "local"
      local_path: "./uploads"
      max_file_size: 10485760
      allowed_types: ["image/jpeg", "image/png", "image/gif"]
    
    monitoring:
      enabled: true
      metrics_path: "/metrics"
      request_logging: true
      slow_request_threshold: 1s

---
# User Management Service Secrets
apiVersion: v1
kind: Secret
metadata:
  name: user-management-secrets
  namespace: agba-system
type: Opaque
data:
  jwt-secret: YWdiYS1qd3Qtc2VjcmV0LWNoYW5nZS1pbi1wcm9kdWN0aW9u # base64 encoded
  smtp-host: c210cC5nbWFpbC5jb20= # base64 encoded smtp.gmail.com
  smtp-user: bm9yZXBseUBhZ2JhLmFp # base64 encoded noreply@agba.ai
  smtp-pass: eW91ci1zbXRwLXBhc3N3b3Jk # base64 encoded your-smtp-password

---
# User Management Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-service
  namespace: agba-system
  labels:
    app: user-management-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-management-service
  template:
    metadata:
      labels:
        app: user-management-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: user-management-service
        image: agba/user-management-service:latest
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: AGBA_USER_ENVIRONMENT
          value: "production"
        - name: AGBA_USER_SERVER_PORT
          value: "8080"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: postgres-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-auth
              key: password
        - name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nats-auth
              key: agba-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: user-management-secrets
              key: jwt-secret
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: user-management-secrets
              key: smtp-host
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: user-management-secrets
              key: smtp-user
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: user-management-secrets
              key: smtp-pass
        volumeMounts:
        - name: config
          mountPath: /etc/user-management-service
        - name: tls-certs
          mountPath: /etc/ssl/certs
        - name: uploads
          mountPath: /app/uploads
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
      volumes:
      - name: config
        configMap:
          name: user-management-service-config
      - name: tls-certs
        secret:
          secretName: internal-services-tls
      - name: uploads
        persistentVolumeClaim:
          claimName: user-management-uploads
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
# PersistentVolumeClaim for uploads
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-management-uploads
  namespace: agba-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
# User Management Service Service
apiVersion: v1
kind: Service
metadata:
  name: user-management-service
  namespace: agba-system
  labels:
    app: user-management-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: user-management-service

---
# User Management Service HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-management-service-hpa
  namespace: agba-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-management-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
# User Management Service PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-management-service-pdb
  namespace: agba-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: user-management-service

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-management-service
  namespace: agba-system
  labels:
    app: user-management-service
spec:
  selector:
    matchLabels:
      app: user-management-service
  endpoints:
  - port: http
    interval: 30s
    path: /metrics

---
# PrometheusRule for User Management Service Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: user-management-service-alerts
  namespace: agba-system
  labels:
    app: user-management-service
spec:
  groups:
  - name: user-management-service
    rules:
    - alert: UserManagementServiceDown
      expr: up{job="user-management-service"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: User Management Service is down
        description: "User Management Service instance is down\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: UserManagementServiceHighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="user-management-service"}[5m])) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: User Management Service high latency
        description: "User Management Service 95th percentile latency is above 1s\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: UserManagementServiceHighErrorRate
      expr: rate(http_requests_total{job="user-management-service",status=~"5.."}[5m]) / rate(http_requests_total{job="user-management-service"}[5m]) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: User Management Service high error rate
        description: "User Management Service error rate is above 5%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: UserManagementServiceHighFailedLogins
      expr: increase(user_management_failed_logins_total[5m]) > 50
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: High number of failed login attempts
        description: "High number of failed login attempts detected\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: UserManagementServiceMemoryHigh
      expr: container_memory_usage_bytes{pod=~"user-management-service-.*"} / container_spec_memory_limit_bytes > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: User Management Service high memory usage
        description: "User Management Service memory usage is above 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

---
# User Management Database Schema Job
apiVersion: batch/v1
kind: Job
metadata:
  name: user-management-service-schema-setup
  namespace: agba-system
spec:
  template:
    spec:
      containers:
      - name: schema-setup
        image: postgres:15-alpine
        command:
        - /bin/sh
        - -c
        - |
          # Wait for PostgreSQL to be ready
          until pg_isready -h pgbouncer -p 5432 -U agba_user; do
            echo "Waiting for PostgreSQL..."
            sleep 5
          done
          
          # Create user management tables
          PGPASSWORD=$POSTGRES_PASSWORD psql -h pgbouncer -U agba_user -d agba_core << 'EOF'
          
          -- User management types enums
          CREATE TYPE user_status AS ENUM ('active', 'inactive', 'suspended', 'pending', 'deleted');
          CREATE TYPE organization_status AS ENUM ('active', 'inactive', 'suspended', 'deleted');
          CREATE TYPE role_type AS ENUM ('system', 'organization', 'custom');
          CREATE TYPE invitation_status AS ENUM ('pending', 'accepted', 'declined', 'expired');
          CREATE TYPE session_status AS ENUM ('active', 'expired', 'revoked');
          
          -- Organizations table
          CREATE TABLE IF NOT EXISTS organizations (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            name VARCHAR(255) NOT NULL UNIQUE,
            display_name VARCHAR(255) NOT NULL,
            description TEXT,
            website VARCHAR(500),
            logo VARCHAR(500),
            status organization_status NOT NULL DEFAULT 'active',
            email VARCHAR(255),
            phone VARCHAR(50),
            address JSONB DEFAULT '{}',
            settings JSONB NOT NULL DEFAULT '{}',
            subscription_plan VARCHAR(100),
            subscription_status VARCHAR(100),
            billing_email VARCHAR(255),
            user_limit INTEGER DEFAULT 100,
            storage_limit BIGINT DEFAULT 10737418240, -- 10GB
            api_call_limit INTEGER DEFAULT 10000,
            owner_id UUID,
            metadata JSONB DEFAULT '{}',
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            deleted_at TIMESTAMP WITH TIME ZONE
          );
          
          -- Users table
          CREATE TABLE IF NOT EXISTS users (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            username VARCHAR(50) UNIQUE,
            email VARCHAR(255) NOT NULL UNIQUE,
            email_verified BOOLEAN DEFAULT FALSE,
            password_hash VARCHAR(255) NOT NULL,
            first_name VARCHAR(100) NOT NULL,
            last_name VARCHAR(100) NOT NULL,
            display_name VARCHAR(200),
            avatar VARCHAR(500),
            phone VARCHAR(50),
            phone_verified BOOLEAN DEFAULT FALSE,
            status user_status NOT NULL DEFAULT 'pending',
            language VARCHAR(10) DEFAULT 'en',
            timezone VARCHAR(50) DEFAULT 'UTC',
            organization_id UUID REFERENCES organizations(id) ON DELETE SET NULL,
            two_factor_enabled BOOLEAN DEFAULT FALSE,
            two_factor_secret VARCHAR(255),
            backup_codes TEXT[],
            last_login_at TIMESTAMP WITH TIME ZONE,
            last_login_ip INET,
            failed_login_attempts INTEGER DEFAULT 0,
            locked_until TIMESTAMP WITH TIME ZONE,
            password_changed_at TIMESTAMP WITH TIME ZONE,
            email_verification_token VARCHAR(255),
            email_verification_expiry TIMESTAMP WITH TIME ZONE,
            password_reset_token VARCHAR(255),
            password_reset_expiry TIMESTAMP WITH TIME ZONE,
            preferences JSONB DEFAULT '{}',
            metadata JSONB DEFAULT '{}',
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            deleted_at TIMESTAMP WITH TIME ZONE
          );
          
          -- Roles table
          CREATE TABLE IF NOT EXISTS roles (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            name VARCHAR(100) NOT NULL,
            display_name VARCHAR(200) NOT NULL,
            description TEXT,
            type role_type NOT NULL DEFAULT 'custom',
            organization_id UUID REFERENCES organizations(id) ON DELETE CASCADE,
            permissions TEXT[] DEFAULT '{}',
            is_default BOOLEAN DEFAULT FALSE,
            is_system BOOLEAN DEFAULT FALSE,
            metadata JSONB DEFAULT '{}',
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            UNIQUE(name, organization_id)
          );
          
          -- Permissions table
          CREATE TABLE IF NOT EXISTS permissions (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            name VARCHAR(100) NOT NULL UNIQUE,
            display_name VARCHAR(200) NOT NULL,
            description TEXT,
            resource VARCHAR(100) NOT NULL,
            action VARCHAR(100) NOT NULL,
            scope VARCHAR(100) NOT NULL,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
          );
          
          -- User roles table
          CREATE TABLE IF NOT EXISTS user_roles (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            role_id UUID NOT NULL REFERENCES roles(id) ON DELETE CASCADE,
            organization_id UUID REFERENCES organizations(id) ON DELETE CASCADE,
            assigned_by UUID REFERENCES users(id) ON DELETE SET NULL,
            assigned_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            expires_at TIMESTAMP WITH TIME ZONE,
            UNIQUE(user_id, role_id, organization_id)
          );
          
          -- Sessions table
          CREATE TABLE IF NOT EXISTS sessions (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            token VARCHAR(255) NOT NULL UNIQUE,
            refresh_token VARCHAR(255) NOT NULL UNIQUE,
            status session_status NOT NULL DEFAULT 'active',
            ip_address INET,
            user_agent TEXT,
            device_info JSONB DEFAULT '{}',
            location JSONB DEFAULT '{}',
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            last_accessed_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
            revoked_at TIMESTAMP WITH TIME ZONE
          );
          
          -- Invitations table
          CREATE TABLE IF NOT EXISTS invitations (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            email VARCHAR(255) NOT NULL,
            organization_id UUID NOT NULL REFERENCES organizations(id) ON DELETE CASCADE,
            role_id UUID NOT NULL REFERENCES roles(id) ON DELETE CASCADE,
            invited_by UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            status invitation_status NOT NULL DEFAULT 'pending',
            token VARCHAR(255) NOT NULL UNIQUE,
            message TEXT,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
            accepted_at TIMESTAMP WITH TIME ZONE,
            declined_at TIMESTAMP WITH TIME ZONE,
            metadata JSONB DEFAULT '{}'
          );
          
          -- Audit logs table
          CREATE TABLE IF NOT EXISTS user_audit_logs (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id UUID REFERENCES users(id) ON DELETE SET NULL,
            organization_id UUID REFERENCES organizations(id) ON DELETE SET NULL,
            action VARCHAR(100) NOT NULL,
            resource VARCHAR(100) NOT NULL,
            resource_id UUID,
            ip_address INET,
            user_agent TEXT,
            old_values JSONB,
            new_values JSONB,
            success BOOLEAN DEFAULT TRUE,
            error_message TEXT,
            metadata JSONB DEFAULT '{}',
            timestamp TIMESTAMP WITH TIME ZONE DEFAULT NOW()
          );
          
          -- User activities table
          CREATE TABLE IF NOT EXISTS user_activities (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            action VARCHAR(100) NOT NULL,
            description TEXT,
            ip_address INET,
            user_agent TEXT,
            metadata JSONB DEFAULT '{}',
            timestamp TIMESTAMP WITH TIME ZONE DEFAULT NOW()
          );
          
          -- Indexes for performance
          CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
          CREATE INDEX IF NOT EXISTS idx_users_username ON users(username);
          CREATE INDEX IF NOT EXISTS idx_users_organization_id ON users(organization_id);
          CREATE INDEX IF NOT EXISTS idx_users_status ON users(status);
          CREATE INDEX IF NOT EXISTS idx_users_created_at ON users(created_at);
          CREATE INDEX IF NOT EXISTS idx_users_last_login_at ON users(last_login_at);
          
          CREATE INDEX IF NOT EXISTS idx_organizations_name ON organizations(name);
          CREATE INDEX IF NOT EXISTS idx_organizations_status ON organizations(status);
          CREATE INDEX IF NOT EXISTS idx_organizations_owner_id ON organizations(owner_id);
          
          CREATE INDEX IF NOT EXISTS idx_roles_name ON roles(name);
          CREATE INDEX IF NOT EXISTS idx_roles_organization_id ON roles(organization_id);
          CREATE INDEX IF NOT EXISTS idx_roles_type ON roles(type);
          
          CREATE INDEX IF NOT EXISTS idx_user_roles_user_id ON user_roles(user_id);
          CREATE INDEX IF NOT EXISTS idx_user_roles_role_id ON user_roles(role_id);
          CREATE INDEX IF NOT EXISTS idx_user_roles_organization_id ON user_roles(organization_id);
          
          CREATE INDEX IF NOT EXISTS idx_sessions_user_id ON sessions(user_id);
          CREATE INDEX IF NOT EXISTS idx_sessions_token ON sessions(token);
          CREATE INDEX IF NOT EXISTS idx_sessions_status ON sessions(status);
          CREATE INDEX IF NOT EXISTS idx_sessions_expires_at ON sessions(expires_at);
          
          CREATE INDEX IF NOT EXISTS idx_invitations_email ON invitations(email);
          CREATE INDEX IF NOT EXISTS idx_invitations_organization_id ON invitations(organization_id);
          CREATE INDEX IF NOT EXISTS idx_invitations_status ON invitations(status);
          CREATE INDEX IF NOT EXISTS idx_invitations_token ON invitations(token);
          
          CREATE INDEX IF NOT EXISTS idx_user_audit_logs_user_id ON user_audit_logs(user_id);
          CREATE INDEX IF NOT EXISTS idx_user_audit_logs_organization_id ON user_audit_logs(organization_id);
          CREATE INDEX IF NOT EXISTS idx_user_audit_logs_action ON user_audit_logs(action);
          CREATE INDEX IF NOT EXISTS idx_user_audit_logs_timestamp ON user_audit_logs(timestamp);
          
          CREATE INDEX IF NOT EXISTS idx_user_activities_user_id ON user_activities(user_id);
          CREATE INDEX IF NOT EXISTS idx_user_activities_timestamp ON user_activities(timestamp);
          
          -- Insert default system roles
          INSERT INTO roles (id, name, display_name, description, type, is_system, permissions) VALUES
          ('00000000-0000-0000-0000-000000000001', 'super_admin', 'Super Administrator', 'Full system access', 'system', true, ARRAY['*']),
          ('00000000-0000-0000-0000-000000000002', 'admin', 'Administrator', 'Organization administrator', 'system', true, ARRAY['users:*', 'organizations:*', 'roles:*']),
          ('00000000-0000-0000-0000-000000000003', 'user', 'User', 'Standard user', 'system', true, ARRAY['profile:read', 'profile:update']),
          ('00000000-0000-0000-0000-000000000004', 'viewer', 'Viewer', 'Read-only access', 'system', true, ARRAY['profile:read'])
          ON CONFLICT (id) DO NOTHING;
          
          -- Insert default permissions
          INSERT INTO permissions (name, display_name, description, resource, action, scope) VALUES
          ('users:create', 'Create Users', 'Create new users', 'users', 'create', 'organization'),
          ('users:read', 'Read Users', 'View user information', 'users', 'read', 'organization'),
          ('users:update', 'Update Users', 'Update user information', 'users', 'update', 'organization'),
          ('users:delete', 'Delete Users', 'Delete users', 'users', 'delete', 'organization'),
          ('organizations:create', 'Create Organizations', 'Create new organizations', 'organizations', 'create', 'system'),
          ('organizations:read', 'Read Organizations', 'View organization information', 'organizations', 'read', 'organization'),
          ('organizations:update', 'Update Organizations', 'Update organization information', 'organizations', 'update', 'organization'),
          ('organizations:delete', 'Delete Organizations', 'Delete organizations', 'organizations', 'delete', 'system'),
          ('roles:create', 'Create Roles', 'Create new roles', 'roles', 'create', 'organization'),
          ('roles:read', 'Read Roles', 'View role information', 'roles', 'read', 'organization'),
          ('roles:update', 'Update Roles', 'Update role information', 'roles', 'update', 'organization'),
          ('roles:delete', 'Delete Roles', 'Delete roles', 'roles', 'delete', 'organization'),
          ('profile:read', 'Read Profile', 'View own profile', 'profile', 'read', 'self'),
          ('profile:update', 'Update Profile', 'Update own profile', 'profile', 'update', 'self')
          ON CONFLICT (name) DO NOTHING;
          
          -- Functions for automatic updates
          CREATE OR REPLACE FUNCTION update_updated_at_column()
          RETURNS TRIGGER AS $$
          BEGIN
            NEW.updated_at = NOW();
            RETURN NEW;
          END;
          $$ LANGUAGE plpgsql;
          
          -- Triggers for automatic updated_at
          CREATE TRIGGER update_users_updated_at BEFORE UPDATE ON users
            FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
          
          CREATE TRIGGER update_organizations_updated_at BEFORE UPDATE ON organizations
            FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
          
          CREATE TRIGGER update_roles_updated_at BEFORE UPDATE ON roles
            FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
          
          -- Function for session cleanup
          CREATE OR REPLACE FUNCTION cleanup_expired_sessions()
          RETURNS void AS $$
          BEGIN
            UPDATE sessions SET status = 'expired' WHERE expires_at < NOW() AND status = 'active';
            DELETE FROM sessions WHERE status = 'expired' AND expires_at < NOW() - INTERVAL '7 days';
          END;
          $$ LANGUAGE plpgsql;
          
          -- Function for invitation cleanup
          CREATE OR REPLACE FUNCTION cleanup_expired_invitations()
          RETURNS void AS $$
          BEGIN
            UPDATE invitations SET status = 'expired' WHERE expires_at < NOW() AND status = 'pending';
          END;
          $$ LANGUAGE plpgsql;
          
          EOF
          
          echo "User management service schema setup completed"
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: postgres-password
      restartPolicy: OnFailure

---
# Network Policy for User Management Service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-management-service-netpol
  namespace: agba-system
spec:
  podSelector:
    matchLabels:
      app: user-management-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from API Gateway
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8080
  # Allow ingress from monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  # Allow ingress from other services for user validation
  - from:
    - namespaceSelector:
        matchLabels:
          name: agba-system
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to PostgreSQL via PgBouncer
  - to:
    - namespaceSelector:
        matchLabels:
          name: agba-data
    - podSelector:
        matchLabels:
          app: pgbouncer
    ports:
    - protocol: TCP
      port: 5432
  # Allow egress to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow egress to NATS
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 4222
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS for email sending and external OAuth
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 25