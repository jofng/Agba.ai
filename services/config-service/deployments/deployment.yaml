# Configuration Service Deployment for Agba Voice AI Platform
# Dynamic configuration management with versioning and validation

apiVersion: v1
kind: ConfigMap
metadata:
  name: config-service-config
  namespace: agba-system
data:
  config.yaml: |
    environment: production
    version: "1.0.0"
    
    server:
      port: 8080
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 120s
    
    database:
      driver: postgres
      dsn: "postgresql://agba_user:${POSTGRES_PASSWORD}@pgbouncer:5432/agba_core?sslmode=require"
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: 300s
    
    redis:
      address: "redis-master:6379"
      password: "${REDIS_PASSWORD}"
      db: 1
      pool_size: 10
    
    nats:
      url: "nats://nats-client:4222"
      username: "agba_user"
      password: "${NATS_PASSWORD}"
    
    config_management:
      max_versions: 50
      cache_ttl: 300s
      validation_timeout: 30s
      notification_enabled: true
      auto_backup_enabled: true
      backup_interval: 24h
      encryption_enabled: true
      compression_enabled: true
      audit_retention_days: 90
      config_validation_level: "strict"
    
    monitoring:
      enabled: true
      metrics_path: "/metrics"
      request_logging: true
      slow_request_threshold: 1s

---
# Configuration Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: agba-system
  labels:
    app: config-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: config-service
        image: agba/config-service:latest
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: AGBA_CONFIG_ENVIRONMENT
          value: "production"
        - name: AGBA_CONFIG_SERVER_PORT
          value: "8080"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: postgres-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-auth
              key: password
        - name: NATS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nats-auth
              key: agba-password
        volumeMounts:
        - name: config
          mountPath: /etc/config-service
        - name: tls-certs
          mountPath: /etc/ssl/certs
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
      volumes:
      - name: config
        configMap:
          name: config-service-config
      - name: tls-certs
        secret:
          secretName: internal-services-tls
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
# Configuration Service Service
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: agba-system
  labels:
    app: config-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: config-service

---
# Configuration Service HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: config-service-hpa
  namespace: agba-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: config-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

---
# Configuration Service PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: config-service-pdb
  namespace: agba-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: config-service

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: config-service
  namespace: agba-system
  labels:
    app: config-service
spec:
  selector:
    matchLabels:
      app: config-service
  endpoints:
  - port: http
    interval: 30s
    path: /metrics

---
# PrometheusRule for Configuration Service Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: config-service-alerts
  namespace: agba-system
  labels:
    app: config-service
spec:
  groups:
  - name: config-service
    rules:
    - alert: ConfigServiceDown
      expr: up{job="config-service"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Configuration Service is down
        description: "Configuration Service instance is down\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: ConfigServiceHighLatency
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="config-service"}[5m])) > 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Configuration Service high latency
        description: "Configuration Service 95th percentile latency is above 1s\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: ConfigServiceHighErrorRate
      expr: rate(http_requests_total{job="config-service",status=~"5.."}[5m]) / rate(http_requests_total{job="config-service"}[5m]) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: Configuration Service high error rate
        description: "Configuration Service error rate is above 5%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: ConfigServiceDatabaseConnectionFailed
      expr: config_service_database_connections_failed_total > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: Configuration Service database connection failed
        description: "Configuration Service cannot connect to database\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: ConfigServiceMemoryHigh
      expr: container_memory_usage_bytes{pod=~"config-service-.*"} / container_spec_memory_limit_bytes > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Configuration Service high memory usage
        description: "Configuration Service memory usage is above 80%\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

---
# Configuration Database Schema Job
apiVersion: batch/v1
kind: Job
metadata:
  name: config-service-schema-setup
  namespace: agba-system
spec:
  template:
    spec:
      containers:
      - name: schema-setup
        image: postgres:15-alpine
        command:
        - /bin/sh
        - -c
        - |
          # Wait for PostgreSQL to be ready
          until pg_isready -h pgbouncer -p 5432 -U agba_user; do
            echo "Waiting for PostgreSQL..."
            sleep 5
          done
          
          # Create configuration tables
          PGPASSWORD=$POSTGRES_PASSWORD psql -h pgbouncer -U agba_user -d agba_core << 'EOF'
          
          -- Configuration types enum
          CREATE TYPE config_type AS ENUM ('agent', 'system', 'organization', 'template');
          CREATE TYPE config_status AS ENUM ('draft', 'active', 'inactive', 'archived');
          
          -- Configurations table
          CREATE TABLE IF NOT EXISTS configurations (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            type config_type NOT NULL,
            entity_id UUID NOT NULL,
            name VARCHAR(255) NOT NULL,
            description TEXT,
            version INTEGER NOT NULL DEFAULT 1,
            status config_status NOT NULL DEFAULT 'draft',
            data JSONB NOT NULL,
            schema JSONB,
            tags TEXT[] DEFAULT '{}',
            created_by UUID NOT NULL,
            updated_by UUID NOT NULL,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            activated_at TIMESTAMP WITH TIME ZONE,
            deactivated_at TIMESTAMP WITH TIME ZONE,
            checksum VARCHAR(64) NOT NULL,
            encrypted BOOLEAN DEFAULT FALSE,
            compressed BOOLEAN DEFAULT FALSE,
            UNIQUE(type, entity_id, status) WHERE status = 'active'
          );
          
          -- Configuration versions table
          CREATE TABLE IF NOT EXISTS configuration_versions (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            configuration_id UUID NOT NULL REFERENCES configurations(id) ON DELETE CASCADE,
            version INTEGER NOT NULL,
            data JSONB NOT NULL,
            schema JSONB,
            change_log TEXT,
            created_by UUID NOT NULL,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            checksum VARCHAR(64) NOT NULL,
            encrypted BOOLEAN DEFAULT FALSE,
            compressed BOOLEAN DEFAULT FALSE,
            UNIQUE(configuration_id, version)
          );
          
          -- Configuration templates table
          CREATE TABLE IF NOT EXISTS config_templates (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            name VARCHAR(255) NOT NULL,
            description TEXT,
            type config_type NOT NULL,
            template JSONB NOT NULL,
            schema JSONB NOT NULL,
            variables JSONB,
            tags TEXT[] DEFAULT '{}',
            created_by UUID NOT NULL,
            updated_by UUID NOT NULL,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            is_public BOOLEAN DEFAULT FALSE,
            usage_count INTEGER DEFAULT 0
          );
          
          -- Configuration schemas table
          CREATE TABLE IF NOT EXISTS config_schemas (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            type config_type NOT NULL,
            version VARCHAR(50) NOT NULL,
            schema JSONB NOT NULL,
            description TEXT,
            created_by UUID NOT NULL,
            updated_by UUID NOT NULL,
            created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            is_active BOOLEAN DEFAULT TRUE,
            UNIQUE(type, version)
          );
          
          -- Audit logs table
          CREATE TABLE IF NOT EXISTS config_audit_logs (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            configuration_id UUID REFERENCES configurations(id) ON DELETE SET NULL,
            action VARCHAR(50) NOT NULL,
            user_id UUID NOT NULL,
            user_email VARCHAR(255),
            ip_address INET,
            user_agent TEXT,
            old_value JSONB,
            new_value JSONB,
            changes JSONB,
            timestamp TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
            success BOOLEAN DEFAULT TRUE,
            error_message TEXT
          );
          
          -- Indexes for performance
          CREATE INDEX IF NOT EXISTS idx_configurations_type_entity ON configurations(type, entity_id);
          CREATE INDEX IF NOT EXISTS idx_configurations_status ON configurations(status);
          CREATE INDEX IF NOT EXISTS idx_configurations_created_at ON configurations(created_at);
          CREATE INDEX IF NOT EXISTS idx_configurations_updated_at ON configurations(updated_at);
          CREATE INDEX IF NOT EXISTS idx_configurations_tags ON configurations USING GIN(tags);
          CREATE INDEX IF NOT EXISTS idx_configurations_data ON configurations USING GIN(data);
          
          CREATE INDEX IF NOT EXISTS idx_config_versions_config_id ON configuration_versions(configuration_id);
          CREATE INDEX IF NOT EXISTS idx_config_versions_created_at ON configuration_versions(created_at);
          
          CREATE INDEX IF NOT EXISTS idx_config_templates_type ON config_templates(type);
          CREATE INDEX IF NOT EXISTS idx_config_templates_public ON config_templates(is_public);
          CREATE INDEX IF NOT EXISTS idx_config_templates_tags ON config_templates USING GIN(tags);
          
          CREATE INDEX IF NOT EXISTS idx_config_schemas_type ON config_schemas(type);
          CREATE INDEX IF NOT EXISTS idx_config_schemas_active ON config_schemas(is_active);
          
          CREATE INDEX IF NOT EXISTS idx_audit_logs_config_id ON config_audit_logs(configuration_id);
          CREATE INDEX IF NOT EXISTS idx_audit_logs_user_id ON config_audit_logs(user_id);
          CREATE INDEX IF NOT EXISTS idx_audit_logs_timestamp ON config_audit_logs(timestamp);
          CREATE INDEX IF NOT EXISTS idx_audit_logs_action ON config_audit_logs(action);
          
          -- Partitioning for audit logs (by month)
          CREATE TABLE IF NOT EXISTS config_audit_logs_y2025m06 PARTITION OF config_audit_logs
          FOR VALUES FROM ('2025-06-01') TO ('2025-07-01');
          
          -- Functions for automatic versioning
          CREATE OR REPLACE FUNCTION update_configuration_version()
          RETURNS TRIGGER AS $$
          BEGIN
            -- Insert into versions table
            INSERT INTO configuration_versions (
              configuration_id, version, data, schema, change_log,
              created_by, checksum, encrypted, compressed
            ) VALUES (
              NEW.id, NEW.version, NEW.data, NEW.schema, 'Updated via trigger',
              NEW.updated_by, NEW.checksum, NEW.encrypted, NEW.compressed
            );
            
            -- Update the updated_at timestamp
            NEW.updated_at = NOW();
            
            RETURN NEW;
          END;
          $$ LANGUAGE plpgsql;
          
          -- Trigger for automatic versioning
          CREATE TRIGGER trigger_configuration_versioning
            AFTER INSERT OR UPDATE ON configurations
            FOR EACH ROW
            EXECUTE FUNCTION update_configuration_version();
          
          EOF
          
          echo "Configuration service schema setup completed"
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: postgres-password
      restartPolicy: OnFailure

---
# Network Policy for Configuration Service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: config-service-netpol
  namespace: agba-system
spec:
  podSelector:
    matchLabels:
      app: config-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from API Gateway
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8080
  # Allow ingress from monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow egress to PostgreSQL via PgBouncer
  - to:
    - namespaceSelector:
        matchLabels:
          name: agba-data
    - podSelector:
        matchLabels:
          app: pgbouncer
    ports:
    - protocol: TCP
      port: 5432
  # Allow egress to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow egress to NATS
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 4222
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53