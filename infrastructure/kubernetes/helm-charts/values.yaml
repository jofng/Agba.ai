# Agba Voice AI Platform - Helm Chart Values
# Default values for agba-platform chart

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: "gp3"
  
# Application Configuration
app:
  name: agba-platform
  version: "1.0.0"
  environment: production
  
# API Gateway Service
apiGateway:
  enabled: true
  replicaCount: 3
  image:
    repository: agba/api-gateway
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# Telephony Gateway Service
telephonyGateway:
  enabled: true
  replicaCount: 5
  image:
    repository: agba/telephony-gateway
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

# WebRTC Service
webrtcService:
  enabled: true
  replicaCount: 3
  image:
    repository: agba/webrtc-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
    targetPort: 8082
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# AI/ML Pipeline Service
aiPipeline:
  enabled: true
  replicaCount: 3
  image:
    repository: agba/ai-pipeline
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8083
    targetPort: 8083
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 8000m
      memory: 16Gi

# Analytics Service
analyticsService:
  enabled: true
  replicaCount: 2
  image:
    repository: agba/analytics-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8084
    targetPort: 8084
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# Configuration Service
configurationService:
  enabled: true
  replicaCount: 2
  image:
    repository: agba/configuration-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8085
    targetPort: 8085
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# Portal Service
portalService:
  enabled: true
  replicaCount: 2
  image:
    repository: agba/portal-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8086
    targetPort: 8086
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# Recording Service
recordingService:
  enabled: true
  replicaCount: 2
  image:
    repository: agba/recording-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8087
    targetPort: 8087
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# Notification Service
notificationService:
  enabled: true
  replicaCount: 2
  image:
    repository: agba/notification-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8088
    targetPort: 8088
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# Biometrics Service
biometricsService:
  enabled: true
  replicaCount: 2
  image:
    repository: agba/biometrics-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8089
    targetPort: 8089
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# Workflow Engine
workflowEngine:
  enabled: true
  replicaCount: 2
  image:
    repository: agba/workflow-engine
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

# Monitoring Service
monitoringService:
  enabled: true
  replicaCount: 1
  image:
    repository: agba/monitoring-service
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8091
    targetPort: 8091
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# PostgreSQL Configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "agba-postgres-password"
    database: "agba_core"
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "gp3"
  readReplicas:
    replicaCount: 2
    persistence:
      enabled: true
      size: 100Gi
      storageClass: "gp3"

# Redis Configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: "agba-redis-password"
  master:
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "gp3"
  replica:
    replicaCount: 3
    persistence:
      enabled: true
      size: 20Gi
      storageClass: "gp3"

# NATS Configuration
nats:
  enabled: true
  cluster:
    enabled: true
    replicas: 3
  jetstream:
    enabled: true
    fileStore:
      pvc:
        size: 50Gi
        storageClassName: "gp3"

# Monitoring Stack
monitoring:
  prometheus:
    enabled: true
    server:
      persistentVolume:
        size: 50Gi
        storageClass: "gp3"
  grafana:
    enabled: true
    persistence:
      enabled: true
      size: 10Gi
      storageClass: "gp3"

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.agba.ai
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
    - host: portal.agba.ai
      paths:
        - path: /
          pathType: Prefix
          service: portal-service
  tls:
    - secretName: agba-tls
      hosts:
        - api.agba.ai
        - portal.agba.ai