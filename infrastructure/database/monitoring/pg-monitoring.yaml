# PostgreSQL Monitoring with pg_stat_monitor and Prometheus
# Comprehensive database monitoring and alerting

apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-exporter-config
  namespace: agba-data
data:
  queries.yaml: |
    pg_replication:
      query: "SELECT EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp())) as lag"
      master: true
      metrics:
        - lag:
            usage: "GAUGE"
            description: "Replication lag behind master in seconds"
    
    pg_postmaster:
      query: "SELECT pg_postmaster_start_time as start_time_seconds from pg_postmaster_start_time()"
      master: true
      metrics:
        - start_time_seconds:
            usage: "GAUGE"
            description: "Time at which postmaster started"
    
    pg_stat_user_tables:
      query: |
        SELECT
          current_database() datname,
          schemaname,
          relname,
          seq_scan,
          seq_tup_read,
          idx_scan,
          idx_tup_fetch,
          n_tup_ins,
          n_tup_upd,
          n_tup_del,
          n_tup_hot_upd,
          n_live_tup,
          n_dead_tup,
          vacuum_count,
          autovacuum_count,
          analyze_count,
          autoanalyze_count
        FROM pg_stat_user_tables
      metrics:
        - datname:
            usage: "LABEL"
            description: "Name of current database"
        - schemaname:
            usage: "LABEL"
            description: "Name of the schema that this table is in"
        - relname:
            usage: "LABEL"
            description: "Name of this table"
        - seq_scan:
            usage: "COUNTER"
            description: "Number of sequential scans initiated on this table"
        - seq_tup_read:
            usage: "COUNTER"
            description: "Number of live rows fetched by sequential scans"
        - idx_scan:
            usage: "COUNTER"
            description: "Number of index scans initiated on this table"
        - idx_tup_fetch:
            usage: "COUNTER"
            description: "Number of live rows fetched by index scans"
        - n_tup_ins:
            usage: "COUNTER"
            description: "Number of rows inserted"
        - n_tup_upd:
            usage: "COUNTER"
            description: "Number of rows updated"
        - n_tup_del:
            usage: "COUNTER"
            description: "Number of rows deleted"
        - n_tup_hot_upd:
            usage: "COUNTER"
            description: "Number of rows HOT updated"
        - n_live_tup:
            usage: "GAUGE"
            description: "Estimated number of live rows"
        - n_dead_tup:
            usage: "GAUGE"
            description: "Estimated number of dead rows"
        - vacuum_count:
            usage: "COUNTER"
            description: "Number of times this table has been manually vacuumed"
        - autovacuum_count:
            usage: "COUNTER"
            description: "Number of times this table has been vacuumed by the autovacuum daemon"
        - analyze_count:
            usage: "COUNTER"
            description: "Number of times this table has been manually analyzed"
        - autoanalyze_count:
            usage: "COUNTER"
            description: "Number of times this table has been analyzed by the autovacuum daemon"

    pg_stat_statements:
      query: |
        SELECT
          t2.rolname,
          t3.datname,
          queryid,
          calls,
          total_time / 1000 as total_time_seconds,
          min_time / 1000 as min_time_seconds,
          max_time / 1000 as max_time_seconds,
          mean_time / 1000 as mean_time_seconds,
          stddev_time / 1000 as stddev_time_seconds,
          rows,
          100.0 * shared_blks_hit / nullif(shared_blks_hit + shared_blks_read, 0) AS shared_blks_hit_percent
        FROM pg_stat_statements t1
        JOIN pg_roles t2 ON (t1.userid=t2.oid)
        JOIN pg_database t3 ON (t1.dbid=t3.oid)
        WHERE t2.rolname != 'rdsadmin'
      metrics:
        - rolname:
            usage: "LABEL"
            description: "Name of user who executed the statement"
        - datname:
            usage: "LABEL"
            description: "Name of database in which the statement was executed"
        - queryid:
            usage: "LABEL"
            description: "Internal hash code, computed from the statement's parse tree"
        - calls:
            usage: "COUNTER"
            description: "Number of times executed"
        - total_time_seconds:
            usage: "COUNTER"
            description: "Total time spent in the statement, in seconds"
        - min_time_seconds:
            usage: "GAUGE"
            description: "Minimum time spent in the statement, in seconds"
        - max_time_seconds:
            usage: "GAUGE"
            description: "Maximum time spent in the statement, in seconds"
        - mean_time_seconds:
            usage: "GAUGE"
            description: "Mean time spent in the statement, in seconds"
        - stddev_time_seconds:
            usage: "GAUGE"
            description: "Population standard deviation of time spent in the statement, in seconds"
        - rows:
            usage: "COUNTER"
            description: "Total number of rows retrieved or affected by the statement"
        - shared_blks_hit_percent:
            usage: "GAUGE"
            description: "Percentage of shared block hits"

---
# PostgreSQL Exporter for Master
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter-master
  namespace: agba-data
  labels:
    app: postgres-exporter
    role: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
      role: master
  template:
    metadata:
      labels:
        app: postgres-exporter
        role: master
    spec:
      containers:
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:v0.12.0
        ports:
        - containerPort: 9187
          name: metrics
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://agba_user:$(POSTGRES_PASSWORD)@postgresql-master:5432/agba_core?sslmode=disable"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: postgres-password
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/postgres_exporter/queries.yaml"
        volumeMounts:
        - name: queries
          mountPath: /etc/postgres_exporter/queries.yaml
          subPath: queries.yaml
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 9187
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 9187
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: queries
        configMap:
          name: pg-exporter-config

---
# PostgreSQL Exporter for Slaves
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter-slave
  namespace: agba-data
  labels:
    app: postgres-exporter
    role: slave
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgres-exporter
      role: slave
  template:
    metadata:
      labels:
        app: postgres-exporter
        role: slave
    spec:
      containers:
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:v0.12.0
        ports:
        - containerPort: 9187
          name: metrics
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://agba_user:$(POSTGRES_PASSWORD)@postgresql-slave:5432/agba_core?sslmode=disable"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: postgres-password
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/postgres_exporter/queries.yaml"
        volumeMounts:
        - name: queries
          mountPath: /etc/postgres_exporter/queries.yaml
          subPath: queries.yaml
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: queries
        configMap:
          name: pg-exporter-config

---
# Service for PostgreSQL Exporter Master
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter-master
  namespace: agba-data
  labels:
    app: postgres-exporter
    role: master
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  ports:
  - port: 9187
    targetPort: 9187
    name: metrics
  selector:
    app: postgres-exporter
    role: master

---
# Service for PostgreSQL Exporter Slaves
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter-slave
  namespace: agba-data
  labels:
    app: postgres-exporter
    role: slave
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  ports:
  - port: 9187
    targetPort: 9187
    name: metrics
  selector:
    app: postgres-exporter
    role: slave

---
# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: agba-data
  labels:
    app: postgres-exporter
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
# PrometheusRule for PostgreSQL Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgresql-alerts
  namespace: agba-data
  labels:
    app: postgres-exporter
spec:
  groups:
  - name: postgresql
    rules:
    - alert: PostgreSQLDown
      expr: pg_up == 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: PostgreSQL down
        description: "PostgreSQL instance is down\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: PostgreSQLReplicationLag
      expr: pg_replication_lag > 30
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: PostgreSQL replication lag
        description: "PostgreSQL replication lag is going to be too high\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: PostgreSQLTooManyConnections
      expr: sum by (instance) (pg_stat_activity_count{state="active"}) > (pg_settings_max_connections * 0.8)
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: PostgreSQL too many connections
        description: "PostgreSQL instance has too many connections\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: PostgreSQLHighRollbackRate
      expr: rate(pg_stat_database_xact_rollback{datname!~"template.*"}[3m]) / rate(pg_stat_database_xact_commit{datname!~"template.*"}[3m]) > 0.02
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: PostgreSQL high rollback rate
        description: "Ratio of transactions being aborted compared to committed is > 2 %\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: PostgreSQLSlowQueries
      expr: avg by (datname) (rate(pg_stat_statements_total_time_seconds[5m]) / rate(pg_stat_statements_calls[5m])) > 1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: PostgreSQL slow queries
        description: "PostgreSQL executes slow queries\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: PostgreSQLHighConnections
      expr: sum by (instance) (pg_stat_activity_count{state="active"}) > (pg_settings_max_connections * 0.9)
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: PostgreSQL high connections
        description: "PostgreSQL instance is reaching maximum connections\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

    - alert: PostgreSQLDeadLocks
      expr: increase(pg_stat_database_deadlocks{datname!~"template.*"}[1m]) > 5
      for: 0m
      labels:
        severity: warning
      annotations:
        summary: PostgreSQL dead locks
        description: "PostgreSQL has dead-locks\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"