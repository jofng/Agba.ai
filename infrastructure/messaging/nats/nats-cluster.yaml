# NATS Cluster Configuration with JetStream for Agba Voice AI Platform
# High-performance message broker for event streaming and service communication

apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: agba-system
data:
  nats.conf: |
    # Server Configuration
    server_name: $POD_NAME
    port: 4222
    http_port: 8222
    
    # Clustering Configuration
    cluster {
      name: agba-nats-cluster
      port: 6222
      
      routes = [
        nats://nats-0.nats.agba-system.svc.cluster.local:6222
        nats://nats-1.nats.agba-system.svc.cluster.local:6222
        nats://nats-2.nats.agba-system.svc.cluster.local:6222
      ]
      
      cluster_advertise: $CLUSTER_ADVERTISE
      connect_retries: 30
    }
    
    # JetStream Configuration
    jetstream {
      store_dir: /data/jetstream
      
      # Memory and file store limits
      max_memory_store: 1GB
      max_file_store: 10GB
      
      # Domain configuration for multi-region
      domain: agba-primary
    }
    
    # Logging
    log_file: "/var/log/nats/nats.log"
    logtime: true
    debug: false
    trace: false
    
    # Limits
    max_connections: 64K
    max_subscriptions: 0
    max_payload: 8MB
    max_pending: 256MB
    
    # Authentication (will be configured via accounts)
    include /etc/nats-config/accounts/accounts.conf
    
    # TLS Configuration
    tls {
      cert_file: "/etc/nats-certs/tls.crt"
      key_file: "/etc/nats-certs/tls.key"
      ca_file: "/etc/nats-certs/ca.crt"
      verify: true
      timeout: 3
    }
    
    # Monitoring
    http_port: 8222
    server_tags: [
      "agba-voice-ai",
      "production",
      "primary-region"
    ]

  accounts.conf: |
    # Account Configuration for Multi-tenancy
    accounts {
      # System Account
      SYS: {
        users: [
          {
            user: "sys_user"
            password: "$SYS_PASSWORD"
          }
        ]
      }
      
      # Application Account
      AGBA: {
        users: [
          {
            user: "agba_user"
            password: "$AGBA_PASSWORD"
          }
        ]
        
        jetstream: {
          max_memory: 512MB
          max_file: 5GB
          max_streams: 100
          max_consumers: 1000
        }
        
        limits: {
          max_connections: 1000
          max_subscriptions: 10000
          max_payload: 8MB
          max_data: 10GB
        }
      }
      
      # Service Account for inter-service communication
      SERVICES: {
        users: [
          {
            user: "service_user"
            password: "$SERVICE_PASSWORD"
          }
        ]
        
        jetstream: {
          max_memory: 256MB
          max_file: 2GB
          max_streams: 50
          max_consumers: 500
        }
      }
    }
    
    # System account designation
    system_account: SYS

---
# NATS StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: agba-system
  labels:
    app: nats
spec:
  serviceName: nats
  replicas: 3
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      # Share process namespace for signal handling
      shareProcessNamespace: true
      
      # Termination grace period
      terminationGracePeriodSeconds: 60
      
      containers:
      - name: nats
        image: nats:2.10-alpine
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 6222
          name: cluster
        - containerPort: 8222
          name: monitor
        
        command:
        - "nats-server"
        - "--config"
        - "/etc/nats-config/nats.conf"
        
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CLUSTER_ADVERTISE
          value: $(POD_NAME).nats.$(POD_NAMESPACE).svc.cluster.local
        - name: SYS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nats-auth
              key: sys-password
        - name: AGBA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nats-auth
              key: agba-password
        - name: SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nats-auth
              key: service-password
        
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nats-config
        - name: data
          mountPath: /data
        - name: tls-certs
          mountPath: /etc/nats-certs
        - name: log-volume
          mountPath: /var/log/nats
        
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        
        # Lifecycle hooks for graceful shutdown
        lifecycle:
          preStop:
            exec:
              command:
              - "nats-server"
              - "-sl=quit"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 30
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 30
      
      # Sidecar for configuration reloading
      - name: reloader
        image: natsio/nats-server-config-reloader:0.14.1
        command:
        - "nats-server-config-reloader"
        - "-pid"
        - "/var/run/nats/nats.pid"
        - "-config"
        - "/etc/nats-config/nats.conf"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nats-config
        - name: pid
          mountPath: /var/run/nats
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      
      volumes:
      - name: config-volume
        configMap:
          name: nats-config
      - name: tls-certs
        secret:
          secretName: nats-tls
      - name: pid
        emptyDir: {}
      - name: log-volume
        emptyDir: {}
  
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: "gp3"
      resources:
        requests:
          storage: 20Gi

---
# NATS Headless Service
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: agba-system
  labels:
    app: nats
spec:
  selector:
    app: nats
  clusterIP: None
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: cluster
    port: 6222
    targetPort: 6222
  - name: monitor
    port: 8222
    targetPort: 8222

---
# NATS Client Service
apiVersion: v1
kind: Service
metadata:
  name: nats-client
  namespace: agba-system
  labels:
    app: nats
spec:
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: monitor
    port: 8222
    targetPort: 8222

---
# NATS Authentication Secret
apiVersion: v1
kind: Secret
metadata:
  name: nats-auth
  namespace: agba-system
type: Opaque
data:
  sys-password: YWdiYS1zeXMtcGFzc3dvcmQ= # agba-sys-password (base64)
  agba-password: YWdiYS1hcHAtcGFzc3dvcmQ= # agba-app-password (base64)
  service-password: YWdiYS1zZXJ2aWNlLXBhc3N3b3Jk # agba-service-password (base64)

---
# NATS TLS Secret (to be created with actual certificates)
apiVersion: v1
kind: Secret
metadata:
  name: nats-tls
  namespace: agba-system
type: kubernetes.io/tls
data:
  tls.crt: # Base64 encoded certificate
  tls.key: # Base64 encoded private key
  ca.crt: # Base64 encoded CA certificate

---
# NATS JetStream Streams Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-streams
  namespace: agba-system
data:
  streams.json: |
    {
      "streams": [
        {
          "name": "CALLS",
          "description": "Call events and lifecycle",
          "subjects": ["calls.>"],
          "retention": "limits",
          "max_consumers": -1,
          "max_msgs": 1000000,
          "max_bytes": 1073741824,
          "max_age": 2592000000000000,
          "max_msg_size": 1048576,
          "storage": "file",
          "num_replicas": 3
        },
        {
          "name": "ANALYTICS",
          "description": "Analytics and metrics events",
          "subjects": ["analytics.>"],
          "retention": "limits",
          "max_consumers": -1,
          "max_msgs": 10000000,
          "max_bytes": 5368709120,
          "max_age": 7776000000000000,
          "storage": "file",
          "num_replicas": 3
        },
        {
          "name": "WEBHOOKS",
          "description": "Outbound webhook events",
          "subjects": ["webhooks.>"],
          "retention": "workqueue",
          "max_consumers": -1,
          "max_msgs": 100000,
          "max_bytes": 104857600,
          "max_age": 86400000000000,
          "storage": "file",
          "num_replicas": 3
        },
        {
          "name": "BIOMETRICS",
          "description": "Voice biometric events",
          "subjects": ["biometrics.>"],
          "retention": "limits",
          "max_consumers": -1,
          "max_msgs": 1000000,
          "max_bytes": 1073741824,
          "max_age": 31536000000000000,
          "storage": "file",
          "num_replicas": 3
        }
      ]
    }

---
# NATS Stream Setup Job
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-stream-setup
  namespace: agba-system
spec:
  template:
    spec:
      containers:
      - name: nats-setup
        image: natsio/nats-box:latest
        command:
        - /bin/sh
        - -c
        - |
          # Wait for NATS to be ready
          until nats --server=nats-client:4222 --user=agba_user --password=$AGBA_PASSWORD server check; do
            echo "Waiting for NATS server..."
            sleep 5
          done
          
          # Create streams from configuration
          cat /etc/streams/streams.json | jq -r '.streams[] | @base64' | while read stream; do
            echo $stream | base64 -d | nats --server=nats-client:4222 --user=agba_user --password=$AGBA_PASSWORD stream add --config=-
          done
          
          echo "NATS streams configured successfully"
        env:
        - name: AGBA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nats-auth
              key: agba-password
        volumeMounts:
        - name: streams-config
          mountPath: /etc/streams
      volumes:
      - name: streams-config
        configMap:
          name: nats-streams
      restartPolicy: OnFailure