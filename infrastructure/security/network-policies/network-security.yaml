---
# External Traffic Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-https
  namespace: agba-system
spec:
  podSelector:
    matchLabels:
      external-access: "true"
  policyTypes:
  - Egress
  egress:
  # Allow HTTPS to external services
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP for health checks and webhooks
  - to: []
    ports:
    - protocol: TCP
      port: 80

---
# Pod Security Policy
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: agba-restricted
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: false

---
# Security Context Constraints (OpenShift)
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: agba-scc
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowedCapabilities: null
defaultAddCapabilities: null
fsGroup:
  type: RunAsAny
readOnlyRootFilesystem: false
requiredDropCapabilities:
- KILL
- MKNOD
- SETUID
- SETGID
runAsUser:
  type: MustRunAsNonRoot
seLinuxContext:
  type: MustRunAs
volumes:
- configMap
- downwardAPI
- emptyDir
- persistentVolumeClaim
- projected
- secret

---
# Network Security Monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-security-rules
  namespace: agba-system
data:
  falco-rules.yaml: |
    # Falco rules for network security monitoring
    - rule: Unexpected Network Connection
      desc: Detect unexpected network connections
      condition: >
        (inbound_outbound) and
        (fd.sockfamily = ip) and
        (not proc.name in (allowed_processes)) and
        (not fd.cip in (allowed_ips))
      output: >
        Unexpected network connection
        (user=%user.name command=%proc.cmdline connection=%fd.name)
      priority: WARNING
      
    - rule: Sensitive File Access
      desc: Detect access to sensitive files
      condition: >
        (open_read or open_write) and
        (fd.name startswith /etc/ssl or
         fd.name startswith /etc/pki or
         fd.name contains password or
         fd.name contains secret)
      output: >
        Sensitive file accessed
        (user=%user.name command=%proc.cmdline file=%fd.name)
      priority: WARNING