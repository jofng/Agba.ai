spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Default Deny All Policy for agba-telephony namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
