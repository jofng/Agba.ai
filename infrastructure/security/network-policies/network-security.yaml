# Network Security Policies for Agba Voice AI Platform
# Kubernetes Network Policies and Security Controls

# Default Deny All Policy for agba-system namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: agba-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Default Deny All Policy for agba-data namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
